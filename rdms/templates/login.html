{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}
{% block public %}
<section class="hero-section" style="padding-top: 2rem;">
  <div class="c-hero-box">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.8rem; margin-bottom: 0.3rem;">Sign In</h2>
      <p class="small muted">Access your student, faculty, or administrative dashboard</p>
    </div>

    <!-- 3-Role Sliding Pill Selector -->
    <div class="c-button-box">
      <div id="btn"></div>
      <button type="button" class="c-toggle-btn active" id="tab-student" onclick="setRole('student')">Student</button>
      <button type="button" class="c-toggle-btn" id="tab-faculty" onclick="setRole('faculty')">Faculty</button>
      <button type="button" class="c-toggle-btn" id="tab-admin" onclick="setRole('admin')">Admin</button>
    </div>

    <form method="POST" action="{{ url_for('main.login') }}" class="c-input-group">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="c-field-wrap">
        <label id="email_label">Student Email</label>
        <input type="email" name="email" id="user_email" class="c-input-field"
               placeholder="aarav.sharma@{{ STUDENT_DOMAIN }}" required autofocus autocomplete="username">
      </div>

      <div class="c-field-wrap">
        <label>Password</label>
        <input type="password" name="password" id="user_password" class="c-input-field"
               placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="c-checkbox-row">
        <label class="c-checkbox-label">
          <input type="checkbox" name="remember" value="y" checked>
          <span>Keep me signed in</span>
        </label>
        <span id="role_hint" class="small muted">Student Portal</span>
      </div>

      <button type="submit" class="c-submit-btn">
        <span>Sign In</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

    </form>
  </div>
</section>

<script>
  let currentRole = 'student';
  const roleConfigs = {
    student: {
      email: 'aarav.sharma@{{ STUDENT_DOMAIN }}',
      pw: 'Student@123',
      label: 'Student Email',
      hint: 'Student Portal',
      btnOffset: '4px'
    },
    faculty: {
      email: 'rajesh.sharma@{{ FACULTY_DOMAIN }}',
      pw: 'Faculty@123',
      label: 'Faculty Email',
      hint: 'Faculty Portal',
      btnOffset: 'calc((100% - 8px) / 3 + 4px)'
    },
    admin: {
      email: 'registrar@{{ ADMIN_DOMAIN }}',
      pw: 'Admin@123',
      label: 'Admin Email',
      hint: 'Admin Portal',
      btnOffset: 'calc(((100% - 8px) / 3) * 2 + 4px)'
    }
  };

  function setRole(role) {
    currentRole = role;
    const btn = document.getElementById('btn');
    const tabs = ['student', 'faculty', 'admin'];

    tabs.forEach(r => {
      const el = document.getElementById('tab-' + r);
      if (r === role) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });

    const cfg = roleConfigs[role];
    btn.style.left = cfg.btnOffset;
    document.getElementById('email_label').innerText = cfg.label;
    document.getElementById('user_email').placeholder = cfg.email;
    document.getElementById('role_hint').innerText = cfg.hint;
  }

</script>
{% endblock %}
